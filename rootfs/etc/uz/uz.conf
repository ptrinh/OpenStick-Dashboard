# UZ801 settings (sourced by uz-* scripts)
UZ_QMI=/dev/wwan0qmi0
UZ_WWAN=wwan0
UZ_PROFILE=3          # qmicli 3gpp profile (list: qmicli -d $UZ_QMI --wds-get-profile-list=3gpp)
UZ_PING=1.1.1.1
UZ_MODE=home          # home | travel  (uz-mode)
UZ_BACKEND=auto       # auto | mm (ModemManager/mmcli) | qmi (qmicli + AT port)
UZ_USBNET=auto        # USB gadget subnet (auto-detected from usb0)
UZ_EXIT_NODE=1        # advertise this stick as a Tailscale exit node (1/0)
