<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="UZ801">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>UZ801</title>
<style>
:root{
  --bg:#000;--text:#f5f5f7;--dim:#a1a1a6;--faint:#6e6e73;
  --glass:rgba(255,255,255,.07);--glass-hi:rgba(255,255,255,.13);--line:rgba(255,255,255,.10);
  --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--yellow:#ffd60a;
  --radius:26px;--ease:cubic-bezier(.2,.8,.2,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:500 17px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
[data-focus]{outline:none;-webkit-tap-highlight-color:transparent}

/* ambient Top Shelf light */
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden}
.ambient i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(120px);opacity:.30;animation:drift 28s ease-in-out infinite alternate}
.ambient i:nth-child(1){background:#2b5cff;top:-35vmax;left:-20vmax}
.ambient i:nth-child(2){background:#8a2be2;bottom:-40vmax;right:-25vmax;animation-delay:-9s;opacity:.2}
.ambient i:nth-child(3){background:#00c2a8;top:30%;left:45%;width:40vmax;height:40vmax;animation-delay:-17s;opacity:.13}
body.offline .ambient i:nth-child(1){background:#ff453a}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}

/* top bar */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:max(16px,env(safe-area-inset-top)) clamp(16px,4vw,56px) 16px;background:linear-gradient(#000d,#0000)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:18px}
.brand-mark{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,#0a84ff,#5e5ce6);box-shadow:0 0 0 1px #ffffff1f}
.brand-mark svg{width:18px;height:18px}
.spacer{flex:1}
.seg{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--glass)}
.seg button{border:0;background:none;border-radius:999px;padding:7px 16px;font-size:14px;font-weight:700;color:var(--dim);cursor:pointer;transition:all .25s var(--ease)}
.seg button.on{background:var(--glass-hi);color:var(--text)}
.seg button:is(:hover,:focus-visible){background:var(--text);color:#000}
.clock{color:var(--faint);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}

main{padding:0 clamp(16px,4vw,56px) 64px;max-width:1320px;margin:0 auto}

/* hero */
.hero{padding:3vh 0 8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;animation:enter .55s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.985)}}
.eyebrow{color:var(--dim);font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px}
h1{font-size:clamp(40px,7vw,80px);line-height:1.02;letter-spacing:-.035em;font-weight:800;margin:0}
h1 em{font-style:normal;background:linear-gradient(90deg,#fff,#8e9aff 60%,#6ee7d8);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--dim);font-size:clamp(17px,2vw,21px);margin:12px 0 0}
.bars{display:flex;gap:6px;align-items:flex-end;height:64px;padding-bottom:6px}
.bars i{width:12px;border-radius:4px;background:#ffffff22;transition:background .4s var(--ease)}
.bars i.on{background:var(--text);box-shadow:0 0 18px #ffffff40}

/* shelves */
.shelf-title{display:flex;align-items:baseline;gap:14px;margin:44px 0 16px}
.shelf-title h2{font-size:24px;letter-spacing:-.02em;font-weight:700;margin:0}
.shelf-title span{color:var(--faint);font-size:15px;font-weight:600}
.row{display:grid;gap:20px}
.top-shelf{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.apps{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:20px}

/* tiles with tvOS lift + sheen */
.tile{--mx:50%;--my:0%;--rx:0deg;--ry:0deg;position:relative;display:flex;flex-direction:column;border:0;text-align:left;cursor:pointer;overflow:hidden;border-radius:var(--radius);background:var(--glass);box-shadow:0 1px 0 #ffffff14 inset;transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .35s var(--ease),box-shadow .35s var(--ease),background .3s;padding:0}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--mx) var(--my),#ffffff2e,transparent 55%);opacity:0;transition:opacity .3s}
.tile:is(:hover,:focus-visible){transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry)) scale(1.06);box-shadow:0 30px 60px #000c,0 0 0 1px #ffffff26 inset;z-index:2}
.tile:is(:hover,:focus-visible)::after{opacity:1}

/* status cards (top shelf) */
.card{min-height:176px;padding:22px;justify-content:space-between;background:var(--g,var(--glass))}
.card .k{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#ffffffc0}
.card .k svg{width:20px;height:20px}
.card .v{font-size:clamp(20px,1.9vw,28px);font-weight:800;letter-spacing:-.025em;line-height:1.15;margin-top:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .v.long{font-size:clamp(16px,1.45vw,22px);letter-spacing:-.01em}
.card .s{color:#ffffffb0;font-size:15px;margin-top:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--faint);margin-right:8px;vertical-align:1px}
.dot.ok{background:var(--green);box-shadow:0 0 10px var(--green)}
.dot.warn{background:var(--orange);box-shadow:0 0 10px var(--orange)}
.dot.bad{background:var(--red);box-shadow:0 0 10px var(--red)}

/* app-icon tiles */
.app{background:transparent;box-shadow:none;overflow:visible}
.app::after{display:none}
.app .icon{aspect-ratio:16/10;border-radius:22px;display:grid;place-items:center;position:relative;overflow:hidden;background:var(--g,linear-gradient(135deg,#3a3a3c,#1c1c1e));box-shadow:0 1px 0 #ffffff30 inset,0 10px 30px #0006;transition:box-shadow .35s var(--ease)}
.app .icon svg{width:36%;height:36%;color:#fff;filter:drop-shadow(0 4px 10px #0004)}
.app .icon::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--mx) var(--my),#ffffff40,transparent 55%);opacity:0;transition:opacity .3s}
.app:is(:hover,:focus-visible){box-shadow:none}
.app:is(:hover,:focus-visible) .icon{box-shadow:0 30px 60px #000d}
.app:is(:hover,:focus-visible) .icon::after{opacity:1}
.app .name{margin:12px 4px 0;font-weight:600;font-size:16px}
.app .sub{margin:1px 4px 0;color:var(--faint);font-size:13px;min-height:18px}
.row>*{min-width:0}.app .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app .icon .badge{position:absolute;top:10px;right:10px;font-size:11px;font-weight:800;letter-spacing:.04em;padding:4px 8px;border-radius:8px;background:#0006;backdrop-filter:blur(10px);color:#fffd}
.app.danger .icon{--g:linear-gradient(135deg,#ff453a,#b0122b)}

/* list cards (sms, probes, disk) */
.list{display:flex;flex-direction:column;gap:12px}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:16px 20px;border-radius:20px;background:var(--glass);animation:enter .5s var(--ease) both}
.item .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--glass-hi)}
.item .ic svg{width:20px;height:20px}
.item b{font-weight:700}
.item small{display:block;color:var(--faint);font-size:13px;margin-top:2px}
.item p{margin:4px 0 0;color:var(--dim);overflow-wrap:anywhere}
.meter{height:8px;border-radius:4px;background:#ffffff14;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;border-radius:4px;background:var(--text);transition:width .6s var(--ease)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.panel{padding:24px;border-radius:var(--radius);background:var(--glass);box-shadow:0 1px 0 #ffffff14 inset}
.panel h3{margin:0 0 14px;font-size:15px;color:var(--dim);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:16px}
.kv span:nth-child(odd){color:var(--faint)}
.empty{color:var(--faint);padding:20px;border-radius:20px;background:var(--glass)}

/* buttons, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:120px;padding:14px 24px;border:0;border-radius:16px;background:var(--glass-hi);color:var(--text);font-size:17px;font-weight:600;cursor:pointer;transition:transform .3s var(--ease),background .2s,color .2s,box-shadow .3s}
.btn.primary{background:var(--text);color:#000}
.btn.red{background:#ff453a33;color:#ff6961}
.btn:disabled{opacity:.35;cursor:default}
.btn:not(:disabled):is(:hover,:focus-visible){background:var(--text);color:#000;transform:scale(1.05);box-shadow:0 18px 40px #0009,0 0 0 1px #fff4}
.btn.sm{min-width:0;padding:10px 16px;font-size:15px;border-radius:13px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.field{display:block;width:100%;background:var(--glass);border:0;border-radius:16px;padding:16px 18px;outline:none;box-shadow:0 0 0 1px var(--line) inset;transition:box-shadow .3s var(--ease);font-size:17px;margin-bottom:12px;resize:vertical}
.field::placeholder{color:#ffffff40}
.field:focus{box-shadow:0 0 0 2px var(--text) inset,0 20px 50px #0008}
.big-secret{font:700 clamp(28px,5vw,44px)/1.1 var(--mono);letter-spacing:.06em;padding:22px 24px;border-radius:20px;background:var(--glass);user-select:all;overflow-wrap:anywhere;margin:6px 0 0}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:0;cursor:pointer;padding:10px 18px;border-radius:999px;background:var(--glass-hi);font-weight:700;font-size:15px;transition:all .25s var(--ease)}
.chip.on{background:var(--text);color:#000}
.chip:is(:hover,:focus-visible){background:var(--text);color:#000;transform:scale(1.05)}
details.log{margin-top:44px}
details.log summary{cursor:pointer;font-size:20px;font-weight:700;list-style:none;display:flex;gap:10px;align-items:center}
details.log summary::-webkit-details-marker{display:none}
details.log summary::before{content:"›";color:var(--dim);transition:transform .25s var(--ease)}
details.log[open] summary::before{transform:rotate(90deg)}
pre{white-space:pre-wrap;font:13px/1.5 var(--mono);color:var(--dim);background:var(--glass);padding:18px;border-radius:20px;max-height:340px;overflow:auto;margin:14px 0 0}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.sheet[hidden]{display:none}
.sheet-backdrop{position:absolute;inset:0;background:#000a;backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.sheet-card{position:relative;width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;border-radius:34px;background:#1c1c1ef2;box-shadow:0 40px 120px #000,0 0 0 1px #ffffff14 inset;display:grid;grid-template-columns:150px 1fr;gap:28px;padding:32px;animation:pop .45s var(--ease) both}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(20px)}}
.sheet-card .sicon{aspect-ratio:1;border-radius:30px;display:grid;place-items:center;background:var(--g);box-shadow:0 1px 0 #ffffff30 inset,0 20px 40px #0008}
.sheet-card .sicon svg{width:44%;height:44%;color:#fff}
.sheet-card h2{font-size:34px;letter-spacing:-.025em;margin:0 0 6px}
.sheet-card .desc{color:var(--dim);margin:0 0 20px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;padding:14px 22px;border-radius:18px;background:#2c2c2ef2;box-shadow:0 20px 60px #000c,0 0 0 1px #ffffff1a inset;font-weight:600;transition:all .4s var(--ease);max-width:min(560px,90vw);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.progress{height:6px;border-radius:3px;background:#ffffff1a;overflow:hidden;margin:6px 0 12px}
.progress i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}
.foot{margin-top:56px;color:var(--faint);font-size:13px}
code{font-family:var(--mono);font-size:.92em;color:var(--dim)}
.group-title{color:var(--faint);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:22px 0 12px}
.group-title:first-child{margin-top:0}
#lock[hidden],main[hidden],.seg[hidden]{display:none!important}
.netrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:4px}
.stat{padding:16px 18px;border-radius:20px;background:var(--glass)}
.stat .l{color:var(--faint);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.stat .n{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:6px;overflow-wrap:anywhere}
.stat .n small{font-size:14px;color:var(--dim);font-weight:600;margin-left:4px}

@media (min-width:1100px){.top-shelf{grid-template-columns:repeat(5,1fr)}.apps{grid-template-columns:repeat(9,1fr)}}
@media (max-width:760px){
  .hero{grid-template-columns:1fr}.bars{height:40px}
  .sheet-card{grid-template-columns:1fr;padding:24px;gap:16px}.sheet-card .sicon{width:84px;border-radius:22px}
  .apps{grid-template-columns:repeat(3,1fr);gap:14px}.app .name{font-size:14px}.app .sub{display:none}
  .top-shelf{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{min-height:150px;padding:18px}.card .v{font-size:22px}
  .clock{display:none}
}
@media (max-width:420px){.apps{grid-template-columns:repeat(2,1fr)}.top-shelf{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="top">
  <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M5 19V15M10 19V11M15 19V7M20 19V3"/></svg></span>UZ801</div>
  <div class="spacer"></div>
  <span class="clock" id="upd">—</span>
  <div class="seg" role="group" id="modeseg"><button data-focus data-mode="home">Home</button><button data-focus data-mode="travel">Travel</button></div>
  <div class="seg" role="group" id="langseg"><button data-focus data-lang="en">EN</button><button data-focus data-lang="vi">VI</button><button data-focus data-lang="zh">中文</button></div>
</header>

<section id="lock" hidden style="min-height:80vh;display:grid;place-items:center;padding:0 24px"></section>
<main id="app">
  <section class="hero">
    <div>
      <p class="eyebrow" id="eyebrow">…</p>
      <h1 id="title">UZ801</h1>
      <p class="lead" id="lead"></p>
    </div>
    <div class="bars" id="bars"><i style="height:25%"></i><i style="height:50%"></i><i style="height:75%"></i><i style="height:100%"></i></div>
  </section>

  <div id="banner"></div>
  <div class="row top-shelf" id="cards"></div>

  <div class="shelf-title"><h2 data-t="network"></h2><span id="netsub"></span></div>
  <div class="netrow" id="net"></div>

  <div class="shelf-title"><h2 data-t="quick"></h2></div>
  <div class="row apps" id="controls"></div>

  <div class="shelf-title"><h2 data-t="messages"></h2><span id="smscount"></span></div>
  <div id="sms"></div>

  <div class="shelf-title"><h2>USB</h2><span id="stfree"></span></div>
  <div class="row apps" id="images"></div>


  <div class="shelf-title"><h2 data-t="settings"></h2></div>
  <div id="settings"></div>

  <div class="shelf-title"><h2 data-t="status"></h2></div>
  <div class="grid2">
    <div class="panel"><h3 data-t="storage"></h3><div id="disk"></div></div>
    <div class="panel"><h3><span data-t="probes"></span> <span id="probevia" style="text-transform:none;letter-spacing:0;font-weight:600;color:var(--faint)"></span></h3><div id="probe"></div></div>
  </div>

  <details class="log"><summary data-t="log"></summary><pre id="log"></pre></details>
  <p class="foot" data-t="foot"></p>
</main>

<div class="sheet" id="sheet" hidden><div class="sheet-backdrop" data-close></div><div class="sheet-card" role="dialog" aria-modal="true" id="card"></div></div>
<div class="toast" id="toast" role="status"></div>

async function post(a,b){const r=await fetch('/api/'+a,{method:'POST',headers:{'Content-Type':'application/json','X-UZ':'1'},body:JSON.stringify(b||{})});if(r.status===401&&!a.startsWith('pk-login')&&a!=='ts-login'&&a!=='qr')setTimeout(load,0);return r.json()}
async function act(a,b){try{const r=await post(a,b);toast(r.error||r.out||t('done'));setTimeout(load,800);return r}catch(e){toast(t('err')+': '+e)}}
const dur=s=>{s=+s;const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+t('days')+' ':'')+h+t('hours')+' '+m+t('mins')};
const gb=m=>m>=1024?(m/1024).toFixed(1)+' GB':m+' MB';
function set(id,html){const el=$(id);if(el._h!==html){el._h=html;el.innerHTML=html}}
function applyStatic(){document.documentElement.lang=lang==='zh'?'zh-Hans':lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
 document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang))}
function usbState(u){if(!u||!u.link)return['',t('usbNone')];if(u.sharing==='in-use')return['ok',t('usbInUse')];if(u.sharing==='available')return['ok',t('usbAvail')];return[u.host?'warn':'',u.host?t('usbHost'):t('usbNone')]}

function render(){
 const s=S,r=s.radio||{},n=s.net||{},online=!!s.uplink;
 document.body.classList.toggle('offline',!online);

 const reg=['registered','home','roaming'].includes(r.reg);
 set('title',reg?`<em>${esc(r.operator||'4G')}</em>`:r.reg==='no SIM'?t('noSim'):esc(r.operator||t('searching')));
 $('lead').textContent=reg?`${(r.net||'LTE').toUpperCase()} · RSRP ${r.rsrp?Math.round(+r.rsrp):'—'} dBm${r.snr?' · SNR '+Math.round(+r.snr)+' dB':''} · ${s.wan_ip||t('noIp')}`:`${t('up')} ${dur(s.uptime)} · ${s.mem_avail_mb} ${t('ramFree')} · ${s.temp_c??'—'} °C`;
 const nb=bars(r);document.querySelectorAll('#bars i').forEach((b,i)=>b.classList.toggle('on',i<nb));

 const g=s.gps||{},tsOk=!!s.ts_ip,[us,ut]=usbState(n.usb);
 const wifiLine=n.ssid?(n.wifi_mode==='ap'?`${t('hotspotOn')}: ${esc(n.ssid)}`:`${esc(n.ssid)}${n.wifi_signal?' · '+t('signal')+' '+n.wifi_signal+'%':''}`):'';
 set('cards',[
  r.sim_restart?card('blue',sigSvg(nb),t('c4g'),t('simChg'),t('simChgD'),'warn','simrestart'):card('blue',sigSvg(nb),t('c4g'),reg?esc(r.operator||'LTE'):r.reg==='no SIM'?t('noSim').replace(/<\/?em>/g,''):t('searching'),reg?`↓ ${r.rx_mb??s.rx_mb} MB · ↑ ${r.tx_mb??s.tx_mb} MB`:([r.net,r.plmn].filter(x=>x&&x!=='--').map(esc).join(' · ')||t('ready')),reg?'ok':r.reg==='no SIM'?'warn':'bad','lte'),

  stat(t('usb'),`<span class="dot ${us}"></span>${ut}`),

 set('controls',[

 if(nk&&nk!==window._smsSeen&&document.visibilityState==='visible'&&(s.ui_modules||[]).includes('leds')){window._smsSeen=nk;post('leds-sms-seen').catch(()=>{})}
 set('sms',`<div class="list">
  <button class="tile item" data-focus data-act="compose" style="grid-template-columns:44px 1fr"><div class="ic" style="background:${G.blue}">${svg('send')}</div><div><b>${t('sendSms')}</b><small>${t('viaSim')}</small></div></button>
  ${sms.slice(0,8).map(m=>`<div class="item"><div class="ic">${svg(m.dir==='in'?'msg':m.dir==='out'?'send':'power')}</div><div><b>${esc(m.peer)}</b><small>${m.dir==='in'?t('inMsg'):m.dir==='out'?t('outMsg'):t('failMsg')} · ${esc(m.ts)}</small><p>${esc(m.text)}</p></div><span></span></div>`).join('')||`<div class="empty">${t('noSms')}</div>`}
 </div>`);

 const st=s.storage||{images:[]},at=st.attached;
 $('stfree').textContent=`${t('free')} ${gb(st.total_free_mb??st.free_mb)}${at?' · '+t('attached')+' '+at.name:''}`;
 set('images',[
  app('purple','kbd',t('kbd'),s.hid?t('on'):t('off'),'kbd',s.hid?'ON':''),
  ...st.images.map(i=>{const on=at&&at.name===i.name;return `<button class="tile app" data-focus data-act="img" data-name="${esc(i.name)}"><div class="icon" style="--g:${on?G.green:G.gray}">${svg('disk')}${on?`<span class="badge">${esc(at.mode.toUpperCase())}</span>`:''}</div><div class="name">${esc(i.name)}</div><div class="sub">${i.mb} MB</div></button>`}),
  app('blue','up',t('upload'),'.img / .iso','upload'),app('gray','plus',t('mkfat'),t('create'),'mkfat'),
  ...(at?[app('orange','eject',t('eject'),t('ejectSub'),'eject')]:[]),

 const dk=s.disk||{parts:[]};
 set('disk',dk.parts.map(p=>{const used=p.total_mb-p.free_mb,pc=Math.round(100*used/Math.max(1,p.total_mb));return `<div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;gap:12px"><b>${esc(t('disk')[p.label]||p.label)}</b><span style="color:var(--dim)">${gb(p.free_mb)} ${t('free').toLowerCase()} / ${gb(p.total_mb)}</span></div><div class="meter"><i style="width:${pc}%;background:${pc>90?'var(--red)':pc>75?'var(--orange)':'var(--text)'}"></i></div></div>`}).join('')+`<div style="color:var(--faint);font-size:14px">${t('images')} ${gb(dk.images_mb)} · ${t('emmc')} ${gb(dk.emmc_mb)}</div>`);
 const P=s.probe||{},pr=Object.entries(P).filter(([k])=>!k.startsWith('_')),pv={wwan0:'4G',wlan0:'Wi-Fi',usb0:'USB'}[P._via]||P._via;

function stat(l,v){return `<div class="stat"><div class="l">${l}</div><div class="n">${v}</div></div>`}
function card(g,ic,k,v,sub,st,a){return `<button class="tile card" data-focus data-act="${a}" style="--g:${G[g]}"><div class="k">${ic.startsWith('<')?ic:svg(ic)}${k}</div><div><div class="v${String(v).replace(/<[^>]*>/g,'').length>12?' long':''}"><span class="dot ${st}"></span>${v}</div><div class="s">${sub||'&nbsp;'}</div></div></button>`}
function app(g,ic,name,sub,a,badge){return `<button class="tile app" data-focus data-act="${a}"><div class="icon" style="--g:${G[g]}">${svg(ic)}${badge?`<span class="badge">${badge}</span>`:''}</div><div class="name">${name}</div><div class="sub">${sub||''}</div></button>`}

/* ---------- passkeys (WebAuthn) ---------- */
const b2a=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');s+='='.repeat((4-s.length%4)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0)).buffer};
const a2b=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function pkLogin(auto){
 if(!window.PublicKeyCredential)return auto||toast(t('pkUnsupported'));
 try{const o=await post('pk-login-begin');if(o.error)return toast(o.error);
  const c=await navigator.credentials.get({publicKey:{...o,challenge:b2a(o.challenge),allowCredentials:o.allowCredentials.map(x=>({...x,id:b2a(x.id)}))}});
  const r=await post('pk-login-finish',{id:c.id,clientDataJSON:a2b(c.response.clientDataJSON),authenticatorData:a2b(c.response.authenticatorData),signature:a2b(c.response.signature),userHandle:c.response.userHandle?a2b(c.response.userHandle):null});
  toast(r.error||r.out);if(!r.error)load()}catch(e){if(!auto&&e.name!=='NotAllowedError')toast(String(e.message||e))}}
async function pkCreate(name){
 if(!window.PublicKeyCredential)return toast(t('pkUnsupported'));
 try{const o=await post('pk-reg-begin');if(o.error)return toast(o.error);
  const c=await navigator.credentials.create({publicKey:{...o,challenge:b2a(o.challenge),user:{...o.user,id:b2a(o.user.id)},excludeCredentials:o.excludeCredentials.map(x=>({...x,id:b2a(x.id)}))}});
  const r=await post('pk-reg-finish',{name,clientDataJSON:a2b(c.response.clientDataJSON),attestationObject:a2b(c.response.attestationObject)});
  toast(r.error||r.out);if(!r.error){closeSheet();await load();A.pk()}}catch(e){toast(e.name==='NotAllowedError'||e.name==='InvalidStateError'?String(e.message||e.name):String(e.message||e))}}
function showLock(x){
 $('app').hidden=true;$('modeseg').hidden=true;$('lock').hidden=false;$('upd').textContent='';
 const ts=x.locked==='tailscale';
 set('lock',`<div style="text-align:center;max-width:620px;animation:enter .55s var(--ease) both">
  <div style="width:96px;height:96px;margin:0 auto 26px;border-radius:26px;display:grid;place-items:center;background:${G.teal};box-shadow:0 20px 40px #0008">${svg('finger').replace('<svg','<svg style="width:48px;height:48px;color:#fff"')}</div>
  <p class="eyebrow">${esc(x.host||'UZ801')}</p><h1>${t('locked')}</h1>
  <p class="lead" style="margin:14px auto 30px">${ts?t('lockedTs'):t('lockedD')}</p>
  ${ts?(x.paired?'':`<button class="btn" data-focus data-act="tslogin">${t('signIn')}</button>`):`<button class="btn primary" data-focus id="pklogin">${t('pkSignIn')}</button>`}</div>`);
 if(!ts){setTimeout(()=>$('pklogin')?.focus(),50);
  // ask for the passkey right away (once per page load); browsers that insist on a tap just keep the button
  if(!window._pkAuto&&window.PublicKeyCredential){window._pkAuto=1;const go=()=>pkLogin(true);document.visibilityState==='visible'?setTimeout(go,250):document.addEventListener('visibilitychange',function v(){if(document.visibilityState==='visible'){document.removeEventListener('visibilitychange',v);go()}})}}}
function hideLock(){$('lock').hidden=true;$('app').hidden=false;$('modeseg').hidden=false}

document.addEventListener('click',async e=>{
 const lb=e.target.closest('[data-lang]');if(lb){lang=lb.dataset.lang;try{localStorage.setItem('uz.lang',lang)}catch(_){}document.querySelectorAll('[id]').forEach(el=>{el._h=null});applyStatic();if(S){render();renderSettings()}return}

 const m=e.target.closest('[data-mode]');if(m){act('mode',{mode:m.dataset.mode});return}

 if(e.target.id==='hidsend'){const x=await post('hid-text',{text:$('hidtxt').value});toast(x.error||x.out);return}
 if(e.target.id==='live'){live=!live;e.target.textContent=t('live')+': '+(live?t('liveOn'):t('off'));e.target.classList.toggle('primary',live);return}

 if(f==='pskf'){const r=await post('hotspot-set',{psk:$('psk').value,ssid:$('ssid').value.trim()===(S._ssid||'')?'':$('ssid').value.trim()});toast(r.error||r.out);if(!r.error){closeSheet();A.psk()}}

function upload(){const f=$('upf').files[0];if(!f)return toast(t('chooseFile'));
 const name=f.name.replace(/[^A-Za-z0-9._-]/g,'_').replace(/^[._-]+/,'').slice(0,80)||'image.img';
 const x=new XMLHttpRequest();x.open('PUT','/api/upload?name='+encodeURIComponent(name));x.setRequestHeader('X-UZ','1');
 const b=$('upb');b.disabled=true;const t0=Date.now();
 x.upload.onprogress=e=>{if(e.lengthComputable){$('upbar').style.width=(100*e.loaded/e.total)+'%';b.textContent=Math.round(100*e.loaded/e.total)+'% · '+(e.loaded/1048576/((Date.now()-t0)/1000)).toFixed(1)+' MB/s'}};
 x.onloadend=()=>{let r={};try{r=JSON.parse(x.responseText)}catch(_){r={error:'upload '+x.status}}toast(r.error||r.out);if(!r.error)closeSheet();else{b.disabled=false;b.textContent=t('upload')}load()};
 x.send(f)}

let live=false,q=Promise.resolve(),lastEsc=0;
document.addEventListener('keydown',e=>{
 if(live&&!sheet.hidden&&!['INPUT','TEXTAREA'].includes(e.target.tagName)){
  if(e.key==='Escape'){const n=Date.now();if(n-lastEsc<600){live=false;const b=$('live');if(b){b.textContent=t('live')+': '+t('off');b.classList.remove('primary')}return}lastEsc=n}
  if(['Shift','Control','Alt','Meta'].includes(e.key))return;e.preventDefault();
  const mods=[e.ctrlKey&&'ctrl',e.altKey&&'alt',e.metaKey&&'gui'].filter(Boolean);const combo=(mods.length?mods.join('+')+'+':'')+(e.key===' '?'space':e.key);
  q=q.then(()=>post('hid-key',{combo})).then(r=>{if(r.error)toast(r.error)}).catch(()=>{});return}
 const typing=['INPUT','TEXTAREA'].includes(e.target.tagName);
 const dir={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];
 if(dir&&!typing){e.preventDefault();moveFocus(dir)}else if(e.key==='Escape'&&!sheet.hidden)closeSheet();
});

/* tvOS-style focus engine + parallax */
function focusables(){const root=sheet.hidden?document:cardEl;return[...root.querySelectorAll('[data-focus]')].filter(el=>!el.disabled&&el.offsetParent!==null)}
function moveFocus(dir){const items=focusables(),cur=document.activeElement;if(!items.includes(cur)){items[0]?.focus();return}
 const c=cur.getBoundingClientRect(),cx=c.left+c.width/2,cy=c.top+c.height/2;let best=null,bs=Infinity;
 for(const el of items){if(el===cur)continue;const r=el.getBoundingClientRect(),dx=r.left+r.width/2-cx,dy=r.top+r.height/2-cy;
  const along={left:-dx,right:dx,up:-dy,down:dy}[dir];if(along<=4)continue;const across=dir==='left'||dir==='right'?Math.abs(dy):Math.abs(dx);const sc=along+across*2.5;if(sc<bs){bs=sc;best=el}}
 if(best){best.focus({preventScroll:true});best.scrollIntoView({block:'nearest',behavior:'smooth'})}}
document.addEventListener('pointermove',e=>{const el=e.target.closest?.('.tile');if(!el)return;const r=el.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
 el.style.setProperty('--mx',px*100+'%');el.style.setProperty('--my',py*100+'%');el.style.setProperty('--ry',(px-.5)*8+'deg');el.style.setProperty('--rx',(.5-py)*8+'deg')});
document.addEventListener('pointerout',e=>{const el=e.target.closest?.('.tile');if(el&&!el.contains(e.relatedTarget)){el.style.setProperty('--rx','0deg');el.style.setProperty('--ry','0deg')}});

/* ---------- settings modules: each /ui/<name>.js calls UZ.register({...}) ---------- */
const MODS=[],loadedMods=new Set();
window.UZ={
 register(m){if(!MODS.find(x=>x.id===m.id)){MODS.push(m);MODS.sort((a,b)=>(a.order||50)-(b.order||50))}if(S)renderSettings()},
 tr:o=>o?(typeof o==='string'?o:(o[lang]??o.en??'')):'', get S(){return S}, get lang(){return lang},
 esc,svg,G,I,toast,post,act,openSheet,closeSheet,closeBtn:()=>closeBtn(),reload:()=>load(),
 card:()=>cardEl, $:sel=>cardEl.querySelector(sel), $$:sel=>[...cardEl.querySelectorAll(sel)],
 core:A, coreT:k=>t(k),
 coreLedManual(){const L3={red:G.red,green:G.green,blue:G.blue};return `<div class="stat" style="margin-bottom:18px"><div class="l">${t('manual')}</div>${Object.entries(S.leds||{}).map(([k,v])=>`<div style="display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap"><span style="width:12px;height:12px;border-radius:6px;background:${L3[k]}"></span><b style="min-width:90px">${t(k)}</b><div class="chips">${Object.entries(t('lm')).map(([m,x])=>`<button class="chip ${v.mode===m?'on':''}" data-focus data-run="led" data-k="mode" data-v="${m}" data-led="${k}">${x}</button>`).join('')}</div></div>`).join('')}
  <div class="actions" style="margin-top:14px"><button class="btn" data-focus data-core="locate">${t('locate')} · ${t('blink10')}</button></div></div>`},
};
const GROUPS=['network','messaging','device','security'];
const PLACE={wifi:['network',10],cellular:['network',20],hotspot:['network',30],tailscale:['network',40],vpn:['network',50],usblink:['network',60],
 smsallow:['messaging',10],calls:['messaging',15],notify:['messaging',20],leds:['device',10],checks:['device',20],system:['device',30],passkeys:['security',10],sshpw:['security',20]};
const tt=k=>({en:L.en[k],vi:L.vi[k],zh:L.zh[k]});
[{id:'tailscale',color:'gray',icon:'net',title:{en:'Tailscale',vi:'Tailscale',zh:'Tailscale'},sub:S=>S.paired?((S.ts||{}).login||'')+(S.exit_node&&S.exit_node.advertised?' · '+t('exitNode'):''):t('notPaired'),open:()=>A.ts()},
 {id:'usblink',color:'purple',icon:'up',title:tt('usbLink'),sub:S=>S.usb_share?t('usbShare'):usbState((S.net||{}).usb)[1],open:()=>A.usb()},

 set('settings',GROUPS.map(g=>{const items=MODS.filter(m=>pl(m)[0]===g).sort((a,b)=>pl(a)[1]-pl(b)[1]);if(!items.length)return '';
  return `<div class="group-title">${t('g_'+g)}</div><div class="row apps">${items.map(settingTile).join('')}</div>`}).join(''))}
function settingTile(m){const sub=typeof m.sub==='function'?m.sub(S):UZ.tr(m.sub);
 return `<button class="tile app" data-focus data-mod="${esc(m.id)}"><div class="icon" style="--g:${G[m.color]||m.color||G.gray}">${m.icon&&I[m.icon]?svg(m.icon):m.iconSvg?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${m.iconSvg}</svg>`:svg('chip')}</div><div class="name">${esc(UZ.tr(m.title))}</div><div class="sub">${esc(sub||'')}</div></button>`}
document.addEventListener('click',e=>{const c=e.target.closest('[data-core]');if(c&&A[c.dataset.core]){closeSheet();setTimeout(()=>A[c.dataset.core](),0);return}});
